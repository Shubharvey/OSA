name: OSA Intelligence Collection

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OSA collector
        env:
          OSA_INGEST_URL: ${{ secrets.OSA_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          if [ -z "$OSA_INGEST_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "Missing OSA_INGEST_URL or INGEST_SECRET repository secrets."
            exit 1
          fi

          response_file="$(mktemp)"
          status=$(curl --silent --show-error \
            --max-time 70 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            -X POST "$OSA_INGEST_URL" \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json")

          echo "Collector response:"
          cat "$response_file"
          echo
          echo "HTTP status: $status"

          if ! [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            rm -f "$response_file"
            exit 1
          fi
          rm -f "$response_file"
