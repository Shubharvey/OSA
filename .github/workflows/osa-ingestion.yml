name: OSA Intelligence Collection

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OSA collector
        env:
          OSA_INGEST_URL: ${{ secrets.OSA_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          if [ -z "$OSA_INGEST_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "Missing OSA_INGEST_URL or INGEST_SECRET repository secrets."
            exit 1
          fi

          response=$(curl --silent --show-error \
            --max-time 70 \
            --write-out "\\n%{http_code}" \
            -X POST "$OSA_INGEST_URL" \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json")

          status="${response##*$'\\n'}"
          body="${response%$'\\n'*}"

          echo "Collector response:"
          echo "$body"
          echo "HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
